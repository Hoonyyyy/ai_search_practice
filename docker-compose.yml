# ────────────────────────────────────────────────────────────
# Docker Compose — 로컬 스택
#
# "docker compose up" 한 줄로 아래 3개 서버가 뜬다.
#   - backend-ai    : Python FastAPI (포트 8001)
#   - backend-spring: Spring Boot API (포트 8080)
#   - frontend      : React + Nginx (포트 3000)
#
# 사전 조건: 호스트에서 Ollama 실행 중 (ollama serve) +
#            llama3.2:3b, nomic-embed-text 모델 pull 완료.
# 벡터 DB는 컨테이너 내부 Qdrant 임베디드(파일) 모드라 별도 서비스 없음.
# ────────────────────────────────────────────────────────────

services:

  backend-ai:
    build: ./backend-ai
    ports:
      - "8001:8001"   # 디버깅용
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - QDRANT_PATH=/app/data/qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - qdrant_data:/app/data/qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend-spring:
    build: ./backend-spring
    ports:
      - "8080:8080"
    environment:
      - AI_SERVICE_URL=http://backend-ai:8001
    volumes:
      - h2_data:/app/data
    depends_on:
      backend-ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/api/documents || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend-spring:
        condition: service_healthy

volumes:
  qdrant_data:   # Qdrant 임베디드 벡터 데이터
  h2_data:       # H2 DB 파일 (문서 목록, 쿼리 로그)
