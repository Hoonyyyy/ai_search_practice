name: keep-alive

# 2026-09-23: 아래 schedule 이 하루 동안 한 번도 실행되지 않았다.
#   워크플로 state=active, 수동 실행 성공, 저장소 공개·포크 아님, GitHub Actions 정상,
#   가장 단순한 "*/5 * * * *" 로 바꿔도 40분간 0건 → 우리 cron 표현식 문제가 아니다.
# 그래서 실제 keep-alive 는 외부 스케줄러(cron-job.org, 매일 10~20시 5분 간격)가 맡고,
# 이 워크플로는 수동 실행(배포 직후 깨우기)과 예약이 되살아날 경우의 이중 보험으로 남긴다.
on:
  schedule:
    - cron: "50 0 * * 1-5"           # 한국 평일 09:50 — 10시 전에 미리 깨우기
    - cron: "5-55/10 1-10 * * 1-5"   # 한국 평일 10:05~19:55, 10분마다
  workflow_dispatch:                 # 수동 실행 버튼 (테스트용)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Spring + Supabase
        run: curl -fsS --max-time 180 -o /dev/null -w "%{http_code} %{time_total}s\n" https://rag-search-api-2i13.onrender.com/api/documents
      - name: FastAPI + Qdrant
        if: always()
        run: curl -fsS --max-time 180 -o /dev/null -w "%{http_code} %{time_total}s\n" https://rag-search-ai.onrender.com/ai/documents/doc-ids
